# CMM-8 / AOS-557: publish one Meeting minutes release as a verified catalogue listing.
#
# Tag-driven and OIDC-only. The catalogue binds this repository, this workflow
# file and `refs/tags/v<version>` to `meeting-minutes`, re-verifies the uploaded
# bytes/digest/identity, and lists that exact version as `published`.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cadence_version:
        description: "Exact Cadence release whose checker supplies canonical digest/inventory (default: v0.3.22)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "12.2.1"
          run_install: false
      - name: Install locked publisher dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the exact pinned Cadence CLI
        env:
          CADENCE_VERSION: ${{ inputs.cadence_version || vars.CADENCE_TARGET_VERSION || 'v0.3.22' }}
        run: |
          set -euo pipefail
          version="${CADENCE_VERSION#v}"
          archive="cadence-v${version}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/favcrm/cadence/releases/download/v${version}/${archive}" \
            --output /tmp/cadence.tgz
          if [ "$version" = "0.3.22" ]; then
            printf '%s  %s\n' f52fc13fcf6b606ffbc63279162a435b67d562df8e455b05da4acf2677073dc4 /tmp/cadence.tgz | sha256sum --check
          fi
          mkdir -p /tmp/cadence-bin
          tar -xzf /tmp/cadence.tgz -C /tmp/cadence-bin
          bin=$(dirname "$(find /tmp/cadence-bin -name cadence -type f | head -1)")
          chmod +x "$bin/cadence"
          echo "$bin" >> "$GITHUB_PATH"
          echo "Canonical checker Cadence ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect the bundle for its canonical digest and inventory
        run: |
          set -euo pipefail
          set +e
          cadence app check app --json > /tmp/app-check.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "app check failed with exit ${status}" >&2
            cat /tmp/app-check.json >&2 || true
            exit 1
          fi
          python3 .github/scripts/assert-app-check.py /tmp/app-check.json
          if [ "$status" -eq 3 ]; then
            echo "Native content admission refused only for hosted-only app-storage; digest/inventory alone prove neither safety nor compatibility. The publisher independently scans the exact uploaded members." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the release to the catalogue directory
        env:
          APP_CHECK_JSON: /tmp/app-check.json
          APP_DIR: app
          EXPECTED_REPOSITORY: favcrm/cadence-app-meeting-minutes
        run: node .github/scripts/publish.mjs
